<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1b1e3d,#0b0c1a);font-family:"Segoe UI",system-ui,sans-serif}
.flag{position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,#111 0 33.3%,#dd0000 0 66.6%,#ffce00 0)}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden}
.shot{position:absolute;inset:56px 90px 150px;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);border:3px solid rgba(255,255,255,.14)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform-origin:50% 50%}
.cap{position:absolute;left:90px;bottom:46px;display:flex;align-items:center;gap:18px;color:#fff;font-size:48px;font-weight:800}
.cap i{width:16px;height:16px;border-radius:50%;background:#dd0000;box-shadow:0 0 0 6px rgba(221,0,0,.25)}
.bug{position:absolute;right:90px;bottom:52px;display:flex;align-items:center;gap:12px;color:#cfd3ff;font-size:30px;font-weight:700}
.two{position:absolute;inset:56px 90px 150px;display:flex;gap:40px;justify-content:center;align-items:center}
.two img{height:100%;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:3px solid rgba(255,255,255,.14)}
.two.wide img{height:auto;max-height:100%;width:48%;object-fit:cover}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;background:rgba(11,12,26,.62)}
.title b{font-size:130px;letter-spacing:1px}.title span{font-size:50px;color:#ffce00;font-weight:800}
.outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:22px}
.outro b{font-size:120px}.outro span{font-size:44px;color:#cfd3ff}.outro em{font-style:normal;font-size:60px;color:#ffce00;font-weight:800}
</style></head><body>
<div id="root"></div><div class="flag"></div>
<script>
const STAMP='<svg viewBox="0 0 64 64" width="SIZE" height="SIZE"><circle cx="32" cy="32" r="29" fill="none" stroke="#e63946" stroke-width="5"/><circle cx="32" cy="32" r="21" fill="none" stroke="#e63946" stroke-width="2.5" stroke-dasharray="4 3"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="900" fill="#e63946" font-family="system-ui,sans-serif">S</text></svg>';
let S, root=document.getElementById('root'), els=[];
async function init(){
  S=await (await fetch('scenes.json')).json();
  for(const s of S.scenes){
    const d=document.createElement('div'); d.className='sc';
    if(s.img==='intro') d.innerHTML='<div class="shot"><img src="shots/01-map.png"></div><div class="title">'+STAMP.replace(/SIZE/g,170)+'<b>StempelMap</b><span>Behördengänge in Deutschland – einfach erklärt</span></div>';
    else if(s.img==='lang') d.innerHTML='<div class="two wide"><img src="shots/08-ar.png"><img src="shots/08-uk.png"></div>';
    else if(s.img==='phones') d.innerHTML='<div class="two"><img src="shots/10-phone-map.png"><img src="shots/10-phone-guide.png"></div>';
    else if(s.img==='outro') d.innerHTML='<div class="outro">'+STAMP.replace(/SIZE/g,220)+'<b>StempelMap</b><span>Kostenlos · 11 Sprachen · Barrierefrei · Keine Behörde</span><em>stempelmap.de</em></div>';
    else d.innerHTML='<div class="shot"><img src="'+s.img+'" style="transform-origin:'+(s.fx*100)+'% '+(s.fy*100)+'%"></div>';
    if(s.img!=='outro'&&s.img!=='intro') d.innerHTML+='<div class="cap"><i></i>'+s.cap+'</div><div class="bug">'+STAMP.replace(/SIZE/g,46)+'StempelMap</div>';
    root.appendChild(d); els.push(d);
  }
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  window.ready=true;
}
const sm=x=>x<0?0:x>1?1:x*x*(3-2*x);
window.render=(t)=>{
  S.scenes.forEach((s,i)=>{
    const fadeIn=i===0?1:sm((t-s.a)/0.45), fadeOut=i===S.scenes.length-1?1:1-sm((t-(s.b-0.05))/0.45);
    els[i].style.opacity=t<s.a-0.01||t>s.b+0.5?0:Math.min(fadeIn,fadeOut);
    const u=Math.max(0,Math.min(1,(t-s.a)/(s.b-s.a)));
    const img=els[i].querySelector('.shot img'); if(img) img.style.transform='scale('+(s.z0+(s.z1-s.z0)*sm(u))+')';
    const two=els[i].querySelector('.two'); if(two) two.style.transform='scale('+(1+0.04*u)+')';
    if(s.img==='intro'){const tt=els[i].querySelector('.title'); const k=sm(t/0.8); tt.style.opacity=k; tt.querySelector('svg').style.transform='scale('+(1.8-0.8*k)+') rotate('+(-20+20*k)+'deg)';}
    if(s.img==='outro'){const sv=els[i].querySelector('svg'); const k=sm((t-s.a)/0.6); sv.style.transform='scale('+(2.2-1.2*k)+') rotate('+(-25+25*k)+'deg)'; sv.style.opacity=k;}
  });
};
init();
</script></body></html>
