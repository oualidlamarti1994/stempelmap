<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0f1022;font-family:"Segoe UI",system-ui,sans-serif}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden}
.shot{position:absolute;inset:60px 90px 150px;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);border:3px solid rgba(255,255,255,.12)}
.shot img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.cap{position:absolute;left:90px;bottom:48px;display:flex;align-items:center;gap:18px;color:#fff;font-size:46px;font-weight:800;letter-spacing:.2px}
.cap i{width:16px;height:16px;border-radius:50%;background:#e63946;box-shadow:0 0 0 6px rgba(230,57,70,.25)}
.bug{position:absolute;right:90px;bottom:52px;display:flex;align-items:center;gap:12px;color:#cfd3ff;font-size:30px;font-weight:700}
iframe{border:0;position:absolute;left:307px;top:22px;width:900px;height:640px;transform:scale(1.45);transform-origin:0 0;background:transparent}
.two{position:absolute;inset:60px 90px 150px;display:flex;gap:40px;justify-content:center;align-items:center}
.two img{height:100%;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);border:3px solid rgba(255,255,255,.12)}
.two.wide img{height:auto;width:48%}
.outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:22px}
.outro b{font-size:120px;letter-spacing:1px}.outro span{font-size:44px;color:#cfd3ff}.outro em{font-style:normal;font-size:56px;color:#ffd166;font-weight:800}
</style></head><body>
<div id="root"></div>
<script>
const STAMP='<svg viewBox="0 0 64 64" width="SIZE" height="SIZE"><circle cx="32" cy="32" r="29" fill="none" stroke="#e63946" stroke-width="5"/><circle cx="32" cy="32" r="21" fill="none" stroke="#e63946" stroke-width="2.5" stroke-dasharray="4 3"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="900" fill="#e63946" font-family="system-ui,sans-serif">S</text></svg>';
let S, root=document.getElementById('root'), els=[];
async function init(){
  S=await (await fetch('scenes.json')).json();
  for(const s of S.scenes){
    const d=document.createElement('div'); d.className='sc';
    if(s.img==='figure') d.innerHTML='<iframe src="figure/press.html" scrolling="no"></iframe>';
    else if(s.img==='lang') d.innerHTML='<div class="two wide"><img src="shots/05-guide-ar.png"><img src="shots/06-guide-uk.png"></div>';
    else if(s.img==='phones') d.innerHTML='<div class="two"><img src="shots/09-phone-hi.png"><img src="shots/10-phone-doctor.png"></div>';
    else if(s.img==='outro') d.innerHTML='<div class="outro">'+STAMP.replace(/SIZE/g,220)+'<b>StempelMap</b><span>Kostenlos · 11 Sprachen · Barrierefrei · Keine Behörde</span><em>stempelmap.de</em></div>';
    else d.innerHTML='<div class="shot"><img src="'+s.img+'" style="transform-origin:'+(s.fx*100)+'% '+(s.fy*100)+'%"></div>';
    if(s.img!=='outro') d.innerHTML+='<div class="cap"><i></i>'+s.cap+'</div><div class="bug">'+STAMP.replace(/SIZE/g,46)+'StempelMap</div>';
    root.appendChild(d); els.push(d);
  }
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  await new Promise(r=>{const f=document.querySelector('iframe'); if(f.contentWindow&&f.contentWindow.__setTime) r(); else f.onload=()=>setTimeout(r,800);});
  window.ready=true;
}
const sm=x=>x<0?0:x>1?1:x*x*(3-2*x);
window.render=(t)=>{
  S.scenes.forEach((s,i)=>{
    const fadeIn=i===0?1:sm((t-s.a)/0.45), fadeOut=i===S.scenes.length-1?1:1-sm((t-(s.b-0.05))/0.45);
    const o=Math.min(fadeIn,fadeOut); els[i].style.opacity=t<s.a-0.01||t>s.b+0.5?0:o;
    const u=Math.max(0,Math.min(1,(t-s.a)/(s.b-s.a)));
    const img=els[i].querySelector('.shot img'); if(img) img.style.transform='scale('+(s.z0+(s.z1-s.z0)*sm(u))+')';
    const two=els[i].querySelector('.two'); if(two) two.style.transform='scale('+(1+0.04*u)+')';
    if(s.img==='figure'){const f=els[i].querySelector('iframe').contentWindow; f.__setTime&&f.__setTime(0.6+t*1.25);}
    if(s.img==='outro'){const sv=els[i].querySelector('svg'); const k=sm((t-s.a)/0.6); sv.style.transform='scale('+(2.2-1.2*k)+') rotate('+(-25+25*k)+'deg)'; sv.style.opacity=k;}
  });
};
init();
</script></body></html>
